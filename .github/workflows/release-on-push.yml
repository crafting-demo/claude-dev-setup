name: Release cs-cc on tag push

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-on-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Compute version
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build cs-cc (linux-amd64)
        run: |
          mkdir -p dist
          go build -ldflags "-X main.version=${{ steps.meta.outputs.version }}" -o dist/cs-cc-linux-amd64 ./cmd/cs-cc

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: cs-cc ${{ steps.meta.outputs.version }}
          prerelease: false
          make_latest: true
          files: |
            dist/cs-cc-linux-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


